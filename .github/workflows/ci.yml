name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable). No Dependabot.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: resolve toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # Corpus tests run against the vendored 2-node fixture; loop-driven contract
      # tests self-skip when the execute-node loop (the Executor component) is absent.
      # A full-harness checkout can still exercise them via $ABPROOF_EXECUTE_NODE.
      - name: test
        run: cargo test --locked
      # .github#20 review: the release workflow's GLIBC-floor gate had never
      # actually been shown to fail. Self-tests ci/glibc-floor.sh against two
      # canned readelf dumps (no binary, no real readelf invocation needed —
      # the script falls back to reading the fixture as already-captured text)
      # so a regression in the gate itself is caught here, in the fast path,
      # not discovered the day a release silently ships over the floor.
      - name: self-test the GLIBC floor gate
        run: |
          set -e
          ci/glibc-floor.sh ci/fixtures/readelf-2.28.txt 2.28
          if ci/glibc-floor.sh ci/fixtures/readelf-2.39-pidfd.txt 2.28; then
            echo "::error::glibc-floor.sh should have failed on the 2.39 fixture but exited 0"
            exit 1
          fi
          echo "glibc-floor.sh correctly failed on the 2.39 fixture"
